[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route the existing /api/* application endpoints to the Netlify catch-all function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Vite SPA fallback. Keep this after the API redirect so API requests are not swallowed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
